[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-paper-mcp"
version = "1.0.0"
description = "One MCP server aggregating 9 upstream paper-search MCP servers (arXiv, Semantic Scholar, Google Scholar, OpenReview, OpenAlex, DBLP, PubMed, bioRxiv, Crossref, CORE, HAL and 30+ more sources)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.27.2,<2",
    "fastmcp>=3.4.2,<4",
    "pydantic>=2.6",
]

[project.scripts]
paper-mcp = "unified_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["unified_mcp"]
